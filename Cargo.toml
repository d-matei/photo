[package]
name = "raw-photo-editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "raw_photo_editor"
path = "src/lib.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
